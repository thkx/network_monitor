[package]
name = "network_monitor"
version = "0.4.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
prettytable = "0.10.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "charset",
    "http2",
    "json",
    "system-proxy",
    # 显式 native-tls：reqwest 0.13 起默认 TLS 改为 rustls(aws-lc-sys)，
    # 会混入第二套 TLS 栈且 aws-lc-sys 的 C 构建在 CI ubuntu 上失败；
    # 本项目全线 native-tls（lettre/tokio-native-tls/x509），保持单一栈
    "native-tls",
] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
trust-dns-resolver = "0.23"
native-tls = "0.2"
tokio-native-tls = "0.3"
x509-parser = "0.15"
sysinfo = "0.30"
diesel = { version = "2.3.3", features = ["chrono", "serde_json", "sqlite", "r2d2", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.3.2", features = ["sqlite"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
backon = "1.6.0"
actix-web = "4"
url = "2"
dotenvy = "0.15"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
# 管理员口令 KDF：由无盐 SHA-256 升级为 argon2id（加盐、抗暴力/GPU）。
# 只用默认特性（含 password-hash）：盐由现有 uuid v4 随机字节派生（SaltString::encode_b64），
# 避免再引入 rand/getrandom。校验走 argon2 PHC 字符串（内部常数时间比较）
argon2 = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"
# EMAIL告警渠道：SMTP发信（tokio1-native-tls提供异步+TLS，复用依赖树中的native-tls）
lettre = { version = "0.11", features = ["tokio1-native-tls"] }

[dev-dependencies]
tempfile = "3"
