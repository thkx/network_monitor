<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网络监控器 · 控制台</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2129; --border: #2a3542; --text: #d8e1ea;
    --muted: #7d8b99; --ok: #3fb950; --fail: #f85149; --warn: #d29922;
    --accent: #58a6ff; --hover: #212b36;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; padding: 24px; }
  .wrap { max-width: 1150px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--muted); margin-bottom: 20px; }
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: var(--hover); border-color: var(--accent); }
  button.primary { background: #1f4a70; border-color: #2a5a8a; }
  button.danger:hover { border-color: var(--fail); color: var(--fail); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 600; background: #161d25; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--hover); }
  .badge { display: inline-block; padding: 1px 9px; border-radius: 10px; font-size: 12px; }
  .ok    { background: #12351c; color: var(--ok); }
  .fail  { background: #3d1618; color: var(--fail); }
  .na    { background: #2a3542; color: var(--muted); }
  .alert { background: #3d2d0f; color: var(--warn); }
  .muted { color: var(--muted); }
  .actions button { padding: 2px 8px; font-size: 12px; margin-right: 4px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-top: 18px; }
  .card h2 { font-size: 15px; margin-bottom: 10px; }
  textarea {
    width: 100%; min-height: 180px; background: #0d1117; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 10px;
    font: 12px/1.5 Consolas, monospace; resize: vertical;
  }
  .err { color: var(--fail); white-space: pre-wrap; margin-top: 8px; font-size: 12px; }
  .hidden { display: none; }
  #resultOut { margin-top: 10px; font: 12px/1.5 Consolas, monospace; white-space: pre-wrap; color: var(--muted); max-height: 300px; overflow: auto; }
  #runOut { margin-top: 10px; font: 12px/1.5 Consolas, monospace; white-space: pre-wrap; }
  details summary { cursor: pointer; color: var(--accent); margin: 6px 0; }
  #loginOverlay {
    position: fixed; inset: 0; background: rgba(6, 10, 14, 0.85);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  /* ID选择器的display:flex优先级高于.hidden，须用复合选择器覆盖，否则浮层无法隐藏 */
  #loginOverlay.hidden { display: none; }
  .login-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 28px; width: 320px; display: flex; flex-direction: column; gap: 10px;
  }
  .login-card h2 { font-size: 16px; }
  .login-card input {
    background: #0d1117; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font-size: 13px;
  }
</style>
</head>
<body>
<div class="wrap hidden">
  <h1>网络监控器 · 控制台</h1>
  <div class="sub">采集 → 告警 → 指标：/metrics 为 Prometheus 端点；本页数据 5 秒自动刷新</div>

  <div class="bar">
    <label><input type="checkbox" id="autoRefresh" checked> 自动刷新（5s）</label>
    <button onclick="refresh(true)">手动刷新</button>
    <button onclick="openNewPanel()">＋ 新建监控</button>
    <label>分组
      <select id="tagFilter" onchange="applyTagFilter()">
        <option value="">全部</option>
      </select>
    </label>
    <span id="updated" class="muted"></span>
    <button onclick="logout()" style="margin-left:auto">⎋ 退出登录</button>
  </div>

  <table id="statusTable">
    <thead>
      <tr>
        <th>状态</th><th>名称</th><th>类型</th><th>目标</th><th>分组</th>
        <th>耗时</th><th>最近检查</th><th>操作</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="newPanel" class="card hidden">
    <h2 id="newTitle">新建监控（SelfDefineMonitorConfig JSON）</h2>
    <details open><summary>示例：HTTP 监控 + 可用性告警（点击折叠）</summary>
      <div id="example" style="color:var(--muted);font:12px Consolas,monospace;white-space:pre-wrap;margin:6px 0;"></div>
    </details>
    <textarea id="newJson" spellcheck="false"></textarea>
    <div class="bar" style="margin-top:10px">
      <button class="primary" id="submitBtn" onclick="submitMonitorForm()">提交创建</button>
      <span class="muted">alert_rules 可省略；consecutive_failures/successes 为防抖参数</span>
    </div>
    <div id="newErr" class="err"></div>
  </div>

  <div id="resultsPanel" class="card hidden">
    <h2 id="resultsTitle">检查结果</h2>
    <div id="resultOut"></div>
  </div>

  <div id="runPanel" class="card hidden">
    <h2 id="runTitle">手动执行结果</h2>
    <div id="runOut"></div>
  </div>
</div>

<!-- 登录浮层：任何数据请求返回401时弹出 -->
<div id="loginOverlay" class="hidden">
  <div class="login-card">
    <h2>网络监控器 · 登录</h2>
    <input id="loginUser" placeholder="用户名" autocomplete="username">
    <input id="loginPass" type="password" placeholder="密码" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')doLogin()">
    <button class="primary" onclick="doLogin()">登录</button>
    <div id="loginErr" class="err"></div>
  </div>
</div>

<script>
const API = {
  status:   '/api/status',
  get:      id => `/api/monitors/${id}`,
  update:   id => `/api/monitors/${id}`,
  run:   id => `/api/monitors/${id}/run`,
  toggle:   id => `/api/monitors/${id}/enabled`,
  del:      id => `/api/monitors/${id}`,
  results:  id => `/api/results?monitor_id=${id}&page_no=1&page_size=15`,
};

const EXAMPLE = {
  target: 'https://example.com', monitor_type: 'HTTP', interval: 60, tag: 'prod',
  alert_rules: {
    notify_type: 'FEISHU',
    notify_config: { webhook_url: 'https://open.feishu.cn/open-apis/bot/v2/hook/xxx' },
    rules: [{ rule_type: 'AVAILABILITY', condition: {} }],
    consecutive_failures: 3, consecutive_successes: 2,
  },
};
document.getElementById('example').textContent = JSON.stringify(EXAMPLE, null, 2);
document.getElementById('newJson').value = JSON.stringify(EXAMPLE, null, 2);

// 登录态守卫：未登录/已登出时所有API轮询一律不发，避免无意义的401请求
// （认证未启用时首次refresh成功即视为已认证）
let authed = false;

// 统一数据请求入口：401时标记未认证并弹出登录浮层（凭证由浏览器cookie自动携带）
async function api(url, opts) {
  const r = await fetch(url, opts);
  if (r.status === 401) { authed = false; showLogin(); throw new Error('需要登录'); }
  return r;
}

function showLogin() {
  document.querySelector('.wrap').classList.add('hidden');
  document.getElementById('loginOverlay').classList.remove('hidden');
}

async function doLogin() {
  const err = document.getElementById('loginErr');
  err.textContent = '';
  try {
    const r = await fetch('/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('loginUser').value,
        password: document.getElementById('loginPass').value,
      }),
    });
    const j = await r.json();
    if (!r.ok) { err.textContent = j.message || ('HTTP ' + r.status); return; }
    authed = true;
    document.getElementById('loginOverlay').classList.add('hidden');
    document.getElementById('loginPass').value = '';
    refresh(false);
  } catch (e) { err.textContent = e.message; }
}

async function logout() {
  try { await fetch('/logout', { method: 'POST' }); } catch (e) {}
  authed = false; // 立即停掉API轮询，登出后不再用失效cookie打401
  showLogin();
}

async function refresh(notify) {
  try {
    const r = await api(API.status);
    const j = await r.json();
    if (j.code !== 200) throw new Error(j.message);
    authed = true; // 拉到数据 = 已登录或认证未启用
    render(j.data);
    // 登录成功（或未启用认证）首次拉到数据后才展示主内容
    document.querySelector('.wrap').classList.remove('hidden');
    if (notify) toast('已刷新');
  } catch (e) { toast('加载失败: ' + e.message, true); }
}

function render(items) {
  lastItems = items || [];
  syncTagOptions(lastItems);
  renderRows();
  document.getElementById('updated').textContent = '更新于 ' + new Date().toLocaleTimeString();
}

// 保存最近一次状态数据 + 当前分组筛选，供客户端按 tag 过滤（/api/status 已全量返回）
let lastItems = [];
function currentTag() { return document.getElementById('tagFilter').value; }
function applyTagFilter() { renderRows(); }

// 依据当前数据里出现过的分组标签刷新下拉选项（保留当前选择，选中项消失则回退到"全部"）
function syncTagOptions(items) {
  const sel = document.getElementById('tagFilter');
  const prev = sel.value;
  const tags = [...new Set(items.map(m => m.tag).filter(t => t != null && t !== ''))].sort();
  sel.innerHTML = '<option value="">全部</option>' +
    tags.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  sel.value = tags.includes(prev) ? prev : '';
}

function renderRows() {
  const tag = currentTag();
  const items = tag ? lastItems.filter(m => m.tag === tag) : lastItems;
  const tb = document.querySelector('#statusTable tbody');
  tb.innerHTML = '';
  for (const m of items) {
    const tr = document.createElement('tr');
    let badge = '<span class="badge na">未检查</span>';
    if (m.last_status === 1) badge = '<span class="badge ok">可用</span>';
    if (m.last_status === 0) badge = '<span class="badge fail">不可用</span>';
    if (m.enabled === 0) badge += ' <span class="badge na">已停用</span>';
    if (m.alerting) badge += ' <span class="badge alert">告警中</span>';
    tr.innerHTML = `
      <td>${badge}</td>
      <td>${esc(m.name)}</td>
      <td><span class="muted">${esc(m.monitor_type)}</span></td>
      <td class="muted">${esc(m.target)}</td>
      <td class="muted">${m.tag ? esc(m.tag) : '—'}</td>
      <td>${m.last_response_time != null ? m.last_response_time + ' ms' : '—'}</td>
      <td class="muted">${m.last_check_at || '—'}</td>
      <td class="actions">
        <button data-act="run" data-id="${esc(m.id)}">▶ 运行</button>
        <button data-act="results" data-id="${esc(m.id)}" data-name="${esc(m.name)}">📋 结果</button>
        <button data-act="edit" data-id="${esc(m.id)}">✎ 编辑</button>
        <button data-act="toggle" data-id="${esc(m.id)}" data-enabled="${esc(m.enabled)}">${m.enabled === 1 ? '⏸ 停用' : '▶ 启用'}</button>
        <button class="danger" data-act="remove" data-id="${esc(m.id)}">🗑</button>
      </td>`;
    tb.appendChild(tr);
  }
}

// 事件委托：表格内按钮动作一律通过data-act/data-id驱动，动态值不再拼进内联onclick
// （此前showResults把监控名插值进onclick属性，HTML实体在属性解码后还原为引号，
//   名字含');即可逃逸JS字符串造成存储型XSS；名称现在经data-name传递，只进textContent）
document.querySelector('#statusTable tbody').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = Number(btn.dataset.id);
  if (!Number.isFinite(id)) return;
  switch (btn.dataset.act) {
    case 'run': runOnce(id); break;
    case 'results': showResults(id, btn.dataset.name || ''); break;
    case 'edit': editMonitor(id); break;
    case 'toggle': toggle(id, Number(btn.dataset.enabled)); break;
    case 'remove': removeMonitor(id); break;
  }
});

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function togglePanel(id) { document.getElementById(id).classList.toggle('hidden'); }

async function submitMonitorForm() {
  const errBox = document.getElementById('newErr');
  errBox.textContent = '';
  try {
    const body = JSON.parse(document.getElementById('newJson').value);
    // editingId为null走新建POST，否则走编辑PUT（enabled状态由服务端保持不变）
    const r = await api(editingId ? API.update(editingId) : '/api/monitors', {
      method: editingId ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if (!r.ok) { errBox.textContent = `HTTP ${r.status}\n` + JSON.stringify(j, null, 2); return; }
    toast(editingId ? '已更新' : '创建成功');
    document.getElementById('newPanel').classList.add('hidden');
    refresh(false);
  } catch (e) { errBox.textContent = 'JSON 解析失败: ' + e.message; }
}

// ---- 新建/编辑共用面板 ----
let editingId = null; // null=新建模式；数字=编辑模式（monitor id）

function openNewPanel() {
  resetEditor();
  document.getElementById('newPanel').classList.toggle('hidden');
}

function resetEditor() {
  editingId = null;
  document.getElementById('newTitle').textContent = '新建监控（SelfDefineMonitorConfig JSON）';
  document.getElementById('submitBtn').textContent = '提交创建';
  document.getElementById('newJson').value = JSON.stringify(EXAMPLE, null, 2);
  document.getElementById('newErr').textContent = '';
}

// 进入编辑模式：/api/status聚合视图不含config_json，需按id回源拉完整配置
async function editMonitor(id) {
  const panel = document.getElementById('newPanel');
  const errBox = document.getElementById('newErr');
  editingId = null; // 先清编辑态：回源失败时保持新建模式，避免残留上一个编辑目标导致提交改错监控
  panel.classList.remove('hidden');
  panel.scrollIntoView({ behavior: 'smooth' });
  errBox.textContent = '';
  try {
    const r = await api(API.get(id));
    const j = await r.json();
    if (j.code !== 200) throw new Error(j.message);
    const cfg = j.data.config_json ? JSON.parse(j.data.config_json) : {};
    editingId = id;
    document.getElementById('newTitle').textContent = `编辑监控 #${id}`;
    document.getElementById('submitBtn').textContent = '保存修改';
    document.getElementById('newJson').value = JSON.stringify(cfg, null, 2);
  } catch (e) { errBox.textContent = '加载配置失败: ' + e.message; }
}

async function runOnce(id) {
  const panel = document.getElementById('runPanel');
  const out = document.getElementById('runOut');
  document.getElementById('runTitle').textContent = `手动执行结果（monitor_id=${id}）`;
  panel.classList.remove('hidden');
  out.textContent = '执行中…';
  try {
    const r = await api(API.run(id), { method: 'POST' });
    const j = await r.json();
    if (!r.ok) { out.textContent = `HTTP ${r.status}: ${JSON.stringify(j)}`; return; }
    const d = j.data;
    out.style.color = d.status ? 'var(--ok)' : 'var(--fail)';
    out.textContent =
      `${d.status ? '✔ 可用' : '✘ 不可用'}  ${d.response_time} ms` +
      (d.status_code != null ? `  状态码 ${d.status_code}` : '') +
      `\ncheck_id: ${d.check_id}\n\n` + JSON.stringify(d.details, null, 2);
    refresh(false);
  } catch (e) { out.style.color = 'var(--fail)'; out.textContent = '执行失败: ' + e.message; }
}

async function showResults(id, name) {
  const panel = document.getElementById('resultsPanel');
  const out = document.getElementById('resultOut');
  document.getElementById('resultsTitle').textContent = `检查结果 — ${name}`;
  panel.classList.remove('hidden');
  try {
    const r = await api(API.results(id));
    const j = await r.json();
    if (j.code !== 200) throw new Error(j.message);
    out.textContent = j.data.list.length === 0
      ? '（暂无结果）'
      : j.data.list.map(x =>
          `#${x.id}  ${x.status === 1 ? '✔' : '✘'}  ${x.response_time} ms  ${x.created_at || ''}`
        ).join('\n') + `\n\n共 ${j.data.total} 条（显示最近 ${j.data.list.length} 条）`;
  } catch (e) { out.textContent = '加载失败: ' + e.message; }
}

async function toggle(id, enabled) {
  await api(API.toggle(id), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled: !(enabled === 1) }) });
  refresh(false);
}

async function removeMonitor(id) {
  if (!confirm(`确认删除监控 ${id}？其历史结果与告警状态将一并清除。`)) return;
  await api(API.del(id), { method: 'DELETE' });
  refresh(false);
}

function toast(msg, isErr) {
  const el = document.getElementById('updated');
  el.textContent = msg;
  el.style.color = isErr ? 'var(--fail)' : '';
  setTimeout(() => { el.style.color = ''; if (authed) refresh(false); }, isErr ? 2500 : 0);
}

// 自动刷新只在已认证时发请求；页面加载先探测一次：
// 认证未启用→拿到数据进入轮询；启用→401弹浮层并保持静默
setInterval(() => { if (authed && document.getElementById('autoRefresh').checked) refresh(false); }, 5000);
refresh(false);
</script>
</body>
</html>
