name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-clippy:
    strategy:
      fail-fast: false
      matrix:
        # ICMP/Traceroute 引擎按平台适配系统命令，双平台都跑
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust stable（含 clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: Clippy（0 警告门槛）
        run: cargo clippy --all-targets -- -D warnings

      - name: 测试
        run: cargo test
