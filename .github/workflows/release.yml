name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 构建 Release
        run: cargo build --release

      - name: 打包产物（二进制 + README）
        shell: bash
        run: |
          mkdir -p dist/network_monitor
          cp README.md dist/network_monitor/
          if [ -f target/release/network_monitor.exe ]; then
            cp target/release/network_monitor.exe dist/network_monitor/
            7z a "network_monitor-${{ matrix.target }}.zip" ./dist/network_monitor
            mv "network_monitor-${{ matrix.target }}.zip" dist/
          else
            cp target/release/network_monitor dist/network_monitor/
            tar czf "dist/network_monitor-${{ matrix.target }}.tar.gz" -C dist network_monitor
          fi

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/network_monitor-*
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签（semver + latest）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
